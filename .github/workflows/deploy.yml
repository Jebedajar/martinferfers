name: Deploy to Cloudflare

# Alternative to Cloudflare Workers Builds (which deploys this repo automatically).
# Only runs when started manually; needs the secrets listed in README.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SITE_URL: https://martinferfers.de
      CLOUDFLARE_ENV: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 1) apply database migrations to D1 (first run also imports the 8 old blog posts)
      - run: pnpm run deploy:database
      # 2) build and upload the Worker
      - run: pnpm run deploy:app
